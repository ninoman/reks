name: Release

# Unsigned developer builds (docs/decisions.md D17). `npm run release -- X.Y.Z` (or the
# Cut release workflow) bumps the version, writes CHANGELOG.md and tags it
# (docs/releasing.md, D41). Pushing the tag `vX.Y.Z`, or dispatching this workflow on it,
# runs the full checks on all three OSes (D31), then builds the app on every platform and
# attaches the bundles to a draft GitHub release, which the maintainer reviews and
# publishes by hand. Signing, notarisation and the updater (`latest.json`) come later;
# until then these builds are for developers only.

on:
  push:
    tags: ["v*"]
  # Used by cut-release.yml, whose GITHUB_TOKEN tag push starts no workflow. Run it on a
  # tag, not a branch; the version check refuses a branch.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and first, so a wrong tag fails before any macOS minute is spent.
  version:
    name: tag matches app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      build: ${{ steps.mode.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      # The tag, Cargo.toml, package.json and tauri.conf.json must agree, or the
      # release would be named after a different version than it contains.
      - name: Check tag matches app version
        shell: bash
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run Release on a vX.Y.Z tag, not a branch"; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ]

      # The release commit's CHANGELOG.md section for this version (D41), from its
      # "## X.Y.Z (date)" heading to the next version's heading.
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "^## $tag " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $tag; tag with npm run release"; exit 1; }
          notes=$(awk -v h="## $tag " 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md)
          [ -n "$(echo "$notes" | tr -d '[:space:]')" ] || notes="No user-facing changes."
          { echo "notes<<REKS_NOTES_EOF"; echo "$notes"; echo "REKS_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      # `npm run release -- X.Y.Z --notes-only` puts "[notes only]" in the annotated tag's
      # message: no checks or builds, just a release with the notes (D41).
      - name: Notes only or full build
        id: mode
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          message=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          if [[ "$message" == *"[notes only]"* ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Notes-only release: checks and builds are skipped."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  notes-only:
    needs: version
    if: needs.version.outputs.build == 'false'
    name: notes-only release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draft release with the notes, no bundles
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --prerelease --title "reks $GITHUB_REF_NAME (notes only)" \
            --notes "$(printf 'Notes-only release: no installers were built for this version.\n\n%s\n' "$NOTES")"

  checks:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      all_os: true

  licenses:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/licenses.yml

  build:
    needs: [version, checks, licenses]
    if: needs.version.outputs.build == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS builds, not one universal binary (D17).
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Oldest supported Ubuntu, so the AppImage and deb run on newer distros.
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file patchelf xdg-utils \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Toolchain from rust-toolchain.toml, plus the cross target for Intel macOS.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: npm ci
        run: npm ci

      # The OneLibrary passphrase is built into release binaries from this secret,
      # never from the repository (D14). A release without it, or with a key that
      # does not open rekordbox's reference file, is refused.
      - name: Check the built-in OneLibrary key
        shell: bash
        env:
          REKS_BUILD_ONELIBRARY_KEY: ${{ secrets.REKS_ONELIBRARY_KEY }}
        run: |
          if [ -z "$REKS_BUILD_ONELIBRARY_KEY" ]; then
            echo "::error::Set the REKS_ONELIBRARY_KEY repository secret (docs/phases/phase-4.md, key policy)."
            exit 1
          fi
          # One platform is enough to prove the secret is right.
          [ "${{ matrix.target }}" = aarch64-apple-darwin ] || exit 0
          out=$(cargo test -p reks-export-onelibrary --test reference builtin_key_opens_the_reference -- --exact 2>&1) \
            || { echo "$out"; exit 1; }
          echo "$out" | grep -q "1 passed" || { echo "$out"; echo "::error::the built-in key test did not run"; exit 1; }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REKS_BUILD_ONELIBRARY_KEY: ${{ secrets.REKS_ONELIBRARY_KEY }}
          # Feedback relay (D34, docs/feedback.md). A variable, not a secret: it ships in the binary.
          REKS_FEEDBACK_URL: ${{ vars.REKS_FEEDBACK_URL }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: reks ${{ github.ref_name }} (unsigned developer build)
          releaseBody: |
            Unsigned developer build. Not notarised or code-signed: macOS Gatekeeper and
            Windows SmartScreen will warn, and there is no auto-update yet.
            Not tested on CDJs; see docs/hw-test-log.md.

            ${{ needs.version.outputs.notes }}
          releaseDraft: true
          prerelease: true

      # The key is stored masked; make sure no build carries it as plain text. The
      # release is still a draft here: if this fails, delete it rather than publish.
      - name: Check the binary has no plain-text key
        shell: bash
        env:
          REKS_BUILD_ONELIBRARY_KEY: ${{ secrets.REKS_ONELIBRARY_KEY }}
        run: |
          found=0
          for f in target/${{ matrix.target }}/release/reks target/${{ matrix.target }}/release/reks.exe \
                   target/${{ matrix.target }}/release/reks-app target/${{ matrix.target }}/release/reks-app.exe; do
            [ -f "$f" ] || continue
            found=1
            if grep -a -F -q -- "$REKS_BUILD_ONELIBRARY_KEY" "$f"; then
              echo "::error::$f contains the OneLibrary key as plain text"
              exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no app binary found to check"; exit 1; }
