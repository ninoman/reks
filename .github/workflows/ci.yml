name: CI

# Actions minutes are billed on this private repo, and macOS minutes count 10x and
# Windows 2x (D31). So PRs run Linux only; the 3-OS matrix runs when release.yml
# calls this workflow, or by hand (Actions > CI > Run workflow > all_os).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      all_os:
        description: Also run on macOS and Windows (about 13x the minutes of a Linux-only run)
        type: boolean
        default: false
  workflow_call:
    inputs:
      all_os:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    # Draft PRs do not run; marking one ready for review does.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_os && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # libclang-dev: bindgen for the key lock engine (D21). macOS has it with
      # Xcode; the Windows image ships LLVM.
      - name: Install Linux system dependencies (Tauri prerequisites, libclang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Reads the channel and components from rust-toolchain.toml and caches target/.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: npm ci
        run: npm ci

      - name: Lint + format check (Biome)
        run: npm run lint

      - name: Frontend tests
        run: npm test

      # The Tauri crate embeds `frontendDist` at compile time, so build the UI first.
      - name: Vite build
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
