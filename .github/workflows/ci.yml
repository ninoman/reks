name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Reads the channel and components from rust-toolchain.toml and caches target/.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: npm ci
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Frontend tests
        run: npm test

      # The Tauri crate embeds `frontendDist` at compile time, so build the UI first.
      - name: Vite build
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  licenses:
    name: licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust: allowlist in deny.toml (docs/decisions.md D18).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          rust-version: "1.99.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      # npm: production dependencies only; the allowlist lives in package.json.
      - name: npm licence check
        run: npm run licenses:check
