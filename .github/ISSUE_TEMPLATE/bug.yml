name: Bug
description: Something reks does wrong.
labels: ["bug"]
projects: ["ninoman/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: reks version and OS
  - type: input
    id: player
    attributes:
      label: Player and firmware
      description: Only for stick or export bugs.
