name: Hardware test result
description: A run of a phase checklist on a real player.
labels: ["needs-hw-test"]
projects: ["ninoman/1"]
body:
  - type: input
    id: checklist
    attributes:
      label: Checklist
      description: e.g. docs/phases/phase-2.md manual checklist
    validations:
      required: true
  - type: input
    id: player
    attributes:
      label: Player model and firmware
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options: ["Pass", "Partial", "Fail"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Steps that failed, and notes
      description: Also record the result in docs/hw-test-log.md.
