# cargo-deny configuration (see docs/decisions.md D18 and CLAUDE.md "Licence rules").
# Run: cargo deny check
# Adding a licence here requires a note in docs/decisions.md.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-or-later",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "IJG",  # jpeg-encoder via baken-export; GPL-compatible, attribution in docs (D18)
]
# GPL-2.0-only, EPL-1.0, CDDL, AGPL-3.0, SSPL, BUSL and unlicensed crates are
# rejected by default because they are not in the allow list.
confidence-threshold = 0.93
# The allowlist is deliberately broader than today's dependency graph.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Each ignore needs a reason here and in docs/decisions.md D18. Drop it when the
# upstream fix lands (cargo deny then reports the ignore as unused).
ignore = [
  # quick-xml 0.37.5 via rekordcrate 0.3.0: denial of service on crafted XML.
  # Only rekordcrate's XML module uses it; reks reads PDB/ANLZ with rekordcrate
  # and parses rekordbox XML with its own code. Fixed in quick-xml >= 0.41.
  { id = "RUSTSEC-2026-0194", reason = "rekordcrate's XML module is unused; waits on rekordcrate bumping quick-xml" },
  { id = "RUSTSEC-2026-0195", reason = "rekordcrate's XML module is unused; waits on rekordcrate bumping quick-xml" },
  # Unmaintained, transitive, no maintained release to move to.
  { id = "RUSTSEC-2024-0436", reason = "paste via lofty (macro-only, build time); waits on lofty" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri's Linux GTK stack (build time); waits on Tauri/gtk-rs" },
]
