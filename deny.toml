# cargo-deny configuration (see docs/decisions.md D18 and CLAUDE.md "Licence rules").
# Run: cargo deny check licenses
# Adding a licence here requires a note in docs/decisions.md.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "LGPL-3.0-or-later",
  "GPL-2.0-or-later",
  "GPL-3.0",
  "GPL-3.0-or-later",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
]
# GPL-2.0-only, EPL-1.0, CDDL, AGPL-3.0, SSPL, BUSL and unlicensed crates are
# rejected by default because they are not in the allow list.
confidence-threshold = 0.93
# The allowlist is deliberately broader than today's dependency graph.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
