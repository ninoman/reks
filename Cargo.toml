[workspace]
resolver = "2"
members = [
  "crates/reks-core",
  "crates/reks-audio",
  "crates/reks-analysis",
  "crates/reks-anlz",
  "crates/reks-export-rb",
  "crates/reks-export-onelibrary",
  "crates/reks-export-engine",
  "crates/reks-cli",
  "fixtures/gen",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates. Explicit versions keep cargo-deny's wildcard check happy.
reks-core = { version = "0.1.0", path = "crates/reks-core" }
reks-audio = { version = "0.1.0", path = "crates/reks-audio" }
reks-analysis = { version = "0.1.0", path = "crates/reks-analysis" }
reks-anlz = { version = "0.1.0", path = "crates/reks-anlz" }
reks-export-rb = { version = "0.1.0", path = "crates/reks-export-rb" }
reks-export-onelibrary = { version = "0.1.0", path = "crates/reks-export-onelibrary" }
reks-export-engine = { version = "0.1.0", path = "crates/reks-export-engine" }

# Shared external dependencies (pin here, reference with `workspace = true`).
anyhow = "1"
blake3 = "1.8"
hound = "3"
imagesize = { version = "0.15", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "aiff", "flac", "wav", "pcm"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
unicode-normalization = "0.1"
walkdir = "2.5"

# Lints shared by the library crates (`[lints] workspace = true`).
# App and CLI crates opt out of the unwrap/expect bans (CLAUDE.md allows them there).
[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Release profile for the Tauri app; profiles live only in the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
