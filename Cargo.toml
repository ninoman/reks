[workspace]
resolver = "2"
members = [
  "crates/reks-core",
  "crates/reks-audio",
  "crates/reks-mix",
  "crates/reks-analysis",
  "crates/reks-anlz",
  "crates/reks-export-rb",
  "crates/reks-export-onelibrary",
  "crates/reks-export-engine",
  "crates/reks-cli",
  "fixtures/gen",
  "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates. Explicit versions keep cargo-deny's wildcard check happy.
reks-core = { version = "0.2.0", path = "crates/reks-core" }
reks-audio = { version = "0.2.0", path = "crates/reks-audio" }
reks-mix = { version = "0.2.0", path = "crates/reks-mix" }
reks-analysis = { version = "0.2.0", path = "crates/reks-analysis" }
reks-anlz = { version = "0.2.0", path = "crates/reks-anlz" }
reks-export-rb = { version = "0.2.0", path = "crates/reks-export-rb" }
reks-export-onelibrary = { version = "0.2.0", path = "crates/reks-export-onelibrary" }
reks-export-engine = { version = "0.2.0", path = "crates/reks-export-engine" }
reks-fixtures-gen = { version = "0.2.0", path = "fixtures/gen" }

# Shared external dependencies (pin here, reference with `workspace = true`).
anyhow = "1"
# Exact pin (D7): young single-maintainer crate; bump only with the writer integration test.
baken-export = "=4.6.1"
# baken-export's own core (CancelToken, Progress in its export API); same pin.
baken-core = "=4.6.1"
# Beat/downbeat tracker (D10), rten backend only. Exact pin: young crate, and
# its output depends on the bundled model files in crates/reks-analysis/models.
beat-this = { version = "=1.1.0", default-features = false }
# Must match the binrw version rekordcrate uses (its row types implement binrw traits).
binrw = "0.14"
blake3 = "1.8"
cpal = "0.18"
deunicode = "1.6"
# Pure-Rust FLAC encoder for the converter (D25). No default features: no rayon-style threads, no serde.
flacenc = { version = "0.5", default-features = false }
hound = "3"
# Artwork thumbnails (decode + resize + JPEG). MIT/Apache-2.0; already in the tree via rten.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
imagesize = { version = "0.15", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
lofty = "0.25"
proptest = "1"
percent-encoding = "2.3"
# PNG writer for the calibration pictures (dev only; already in the tree via image). MIT/Apache-2.0.
png = "0.18"
quick-xml = "0.42"
# Analysis queue worker pool (phase 3 task 11). MIT/Apache-2.0; already in the tree via rten.
rayon = "1.12"
# PDB/ANLZ reader for history and read-back validation (MPL-2.0, D7). Pinned: young crate.
rekordcrate = { version = "=0.3.0", default-features = false }
# Process CPU time for the parity harness (reks-cli, unix only). MIT/Apache-2.0; already in the tree.
libc = "0.2"
# FFT for key detection (D12). MIT/Apache-2.0.
rustfft = "6.4"
# `backup`: online backup API for library snapshots (D36); gated code in the same crate, no new dependency.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rubato = "5"
# Key lock (phase 5 task 10), exact pins: young crates. signalsmith-stretch
# (MIT) is reks-mix's key lock head, chosen by listening (D21); it compiles
# C++ with cc + bindgen, so building needs libclang. timestretch (pure Rust)
# and rubberband stay behind reks-cli features for listening comparisons.
# See research.md §9.3.
timestretch = "=0.15.0"
signalsmith-stretch = "=0.1.3"
# GPL-2.0-or-later (Rubber Band 4.0.0 vendored), compatible with GPL-3.0-or-later.
rubberband = "=0.1.5"
rtrb = "0.4"
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "aiff", "flac", "wav", "pcm"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
# Moves converted-away originals to the OS Trash, only when asked (D25). MIT.
trash = "5"
unicode-normalization = "0.1"
walkdir = "2.5"
# Wipes the OneLibrary key from memory on drop (Phase 4 key policy). Apache-2.0 OR MIT.
zeroize = "1.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

# Lints shared by the library crates (`[lints] workspace = true`).
# App and CLI crates opt out of the unwrap/expect bans (CLAUDE.md allows them there).
[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Release profile for the Tauri app; profiles live only in the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dev builds still decode and resample at usable speed: unoptimised Symphonia
# and rubato take ~30 s for a 6-minute FLAC resampled to 48 kHz, ~0.7 s at
# opt-level 3. reks-audio is listed because rubato's generics are compiled
# there; reks-mix runs the audio callback. Debug info and checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.reks-audio]
opt-level = 3

[profile.dev.package.reks-mix]
opt-level = 3

# Key detection instantiates rustfft's generic FFTs here (key tests: 17 s → 0.3 s).
[profile.dev.package.reks-analysis]
opt-level = 3
