[package]
name = "reks-app"
description = "reks desktop app (Tauri shell). No business logic here; see crates/."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Unique lib name so it cannot collide with the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "reks_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reks-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reks-analysis = { workspace = true }
reks-core = { workspace = true }
reks-mix = { workspace = true }
# The OneLibrary stub until reks-export-onelibrary lands (phase 4 task 8).
reks-export-rb = { workspace = true, features = ["onelibrary-stub"] }
