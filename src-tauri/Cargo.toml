[package]
name = "reks-app"
description = "reks desktop app (Tauri shell). No business logic here; see crates/."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Unique lib name so it cannot collide with the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "reks_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reks-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Log file for bug reports (D33). MIT.
tracing-appender = "0.2"
tracing-subscriber = "0.3"
# Sends reports to the feedback relay (D33). rustls with ring and the OS
# certificate store: aws-lc and webpki-roots would add licences outside deny.toml.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reks-analysis = { workspace = true }
reks-core = { workspace = true }
reks-mix = { workspace = true }
reks-export-onelibrary = { workspace = true }
reks-export-rb = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
