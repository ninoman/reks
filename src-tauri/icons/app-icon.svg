<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- reks app icon source. Regenerate the set with `cargo tauri icon src-tauri/icons/app-icon.svg`.
       Body is 824 px on a 1024 canvas (macOS icon grid), so the same file works on every OS. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d34"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c9cf5"/>
      <stop offset="1" stop-color="#2f6fde"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>

  <!-- Record -->
  <circle cx="512" cy="512" r="330" fill="#08090b" stroke="#3a3e48" stroke-width="6"/>
  <g fill="none" stroke="#2b2e36" stroke-width="5">
    <circle cx="512" cy="512" r="300"/>
    <circle cx="512" cy="512" r="268"/>
    <circle cx="512" cy="512" r="236"/>
    <circle cx="512" cy="512" r="204"/>
    <circle cx="512" cy="512" r="172"/>
  </g>
  <!-- Light catching the grooves -->
  <path d="M512 512 L395 203 A330 330 0 0 1 629 203 Z" fill="url(#sheen)"/>
  <path d="M512 512 L629 821 A330 330 0 0 1 395 821 Z" fill="url(#sheen)" opacity="0.6"/>

  <!-- Label and spindle -->
  <circle cx="512" cy="512" r="128" fill="url(#label)"/>
  <circle cx="512" cy="512" r="18" fill="#121317"/>

  <!-- Cue marker on the rim -->
  <circle cx="745" cy="279" r="34" fill="#f2b632"/>
</svg>
