[package]
name = "reks-export-onelibrary"
description = "reks OneLibrary (exportLibrary.db) export (Phase 4)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reks-core = { workspace = true }
reks-export-rb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# SQLCipher replaces the bundled SQLite for the whole build (feature
# unification), library DB included; see docs/decisions.md D14. Apple builds
# use CommonCrypto; elsewhere OpenSSL is built from source so no system
# libcrypto (Linux) or OPENSSL_DIR (Windows) is needed.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
