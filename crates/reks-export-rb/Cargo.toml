[package]
name = "reks-export-rb"
description = "reks legacy rekordbox USB export: plan, dry-run, write, validate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Synthetic export.pdb / ANLZ builders for other crates' tests (reks-cli).
test-util = []

[dependencies]
baken-core = { workspace = true }
baken-export = { workspace = true }
blake3 = { workspace = true }
reks-analysis = { workspace = true }
reks-anlz = { workspace = true }
reks-audio = { workspace = true }
reks-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
# The writer's scratch folder (report::export).
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
baken-core = { workspace = true }
binrw = { workspace = true }
proptest = { workspace = true }
# The independent PDB parser of the writer's round-trip tests; never used on
# stick bytes in the app (D8, review F03).
rekordcrate = { workspace = true }
