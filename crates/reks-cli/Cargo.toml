[package]
name = "reks-cli"
description = "Thin command-line interface over the reks crates for headless testing and CI fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reks"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
reks-analysis = { workspace = true }
reks-anlz = { workspace = true }
reks-audio = { workspace = true }
reks-core = { workspace = true }
reks-export-rb = { workspace = true }
reks-mix = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
reks-export-rb = { workspace = true, features = ["test-util"] }
